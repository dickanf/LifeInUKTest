<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life in the UK Test — Study Guide</title>

  <!-- ── NO-CACHE: force browser to always re-fetch ── -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma"        content="no-cache" />
  <meta http-equiv="Expires"       content="0" />

  <style>
    body { margin:0; font-family:'Segoe UI',sans-serif; background:#f4f6fb;
           display:flex; align-items:center; justify-content:center; min-height:100vh; }
    p { color:#6b7280; font-size:.9rem; }
  </style>
</head>
<body>
  <p>Loading&#8230;</p>

  <script>
    // ── BUMP THIS on every deploy ──────────────────────────────
    const VERSION = '20261006.16';
    // ──────────────────────────────────────────────────────────

    // Redirect to content.html with version query param.
    // The different URL forces the browser to bypass its cache.
    window.location.replace('content.html?v=' + VERSION);
  </script>

  <!-- Fallback for browsers with JS disabled -->
  <noscript>
    <meta http-equiv="refresh" content="0; url=content.html" />
  </noscript>
</body>
</html>
